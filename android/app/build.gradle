plugins { id 'com.android.application' }

// Legacy GitHub APK test signer only. NEW Google Play upload signer is a separate generation.
def buildEpoch = (project.findProperty('nutbusterBuildEpochSeconds') ?: '0').toString().toLong()
def buildCode = buildEpoch > 1577836800L ? (buildEpoch - 1577836800L).intValue() : 1
def pinnedSigner = rootProject.file('../config/nutbuster-publisher.sha256').text.trim()
def signerHash = (project.findProperty('nutbusterSignerSha256') ?: '').toString().toLowerCase()
if (!(pinnedSigner ==~ /[0-9a-f]{64}/)) throw new GradleException('Invalid pinned NUTBUSTER certificate SHA-256')
def signingPath = (project.findProperty('phoneTestKeystorePath') ?: '').toString()
def storePass = (project.findProperty('phoneTestStorePassword') ?: '').toString()
def publisherAlias = (project.findProperty('phoneTestKeyAlias') ?: '').toString()
def publisherKeyPassword = (project.findProperty('phoneTestKeyPassword') ?: '').toString()
def haveSigning = signingPath && storePass && publisherAlias && publisherKeyPassword && file(signingPath).isFile()
// 2026 Play generation: requires a NEW upload key, never the phone-test publisher key.
def playStore = (project.findProperty('playUploadKeystorePath') ?: '').toString()
def playPassword = (project.findProperty('playUploadStorePassword') ?: '').toString()
def playAlias = (project.findProperty('playUploadKeyAlias') ?: '').toString()
def playKeyPassword = (project.findProperty('playUploadKeyPassword') ?: '').toString()
def havePlaySigning = playStore && playPassword && playKeyPassword &&
    playAlias == 'nutbuster-play-upload-v1' && file(playStore).isFile()

android {
    namespace 'io.github.mrcalzon02.nutbuster'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.mrcalzon02.nutbuster'
        minSdk 26
        targetSdk 36
        versionCode buildCode
        versionName buildCode > 1 ? '0.1.0-test.' + buildCode : '0.1.0-alpha'
        buildConfigField 'String', 'DISTRIBUTION_SIGNER_SHA256', '"' + signerHash + '"'
        buildConfigField 'boolean', 'UPDATE_CHANNEL_ENABLED', (haveSigning && signerHash == pinnedSigner).toString()
    }
    // android/app -> ../../web. The earlier ../../../web pointed outside the repository.
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (haveSigning) {
            phoneTest {
                storeFile file(signingPath)
                storePassword storePass
                keyAlias publisherAlias
                keyPassword publisherKeyPassword
            }
        }
        if (havePlaySigning) {
            playUpload {
                storeFile file(playStore)
                storePassword playPassword
                keyAlias playAlias
                keyPassword playKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (haveSigning) signingConfig signingConfigs.phoneTest
        }
        debug { debuggable true }
        // Play Store-only AAB: Google Play will apply its own device signing key.
        play {
            initWith release
            signingConfig null
            debuggable false
            buildConfigField 'boolean', 'UPDATE_CHANNEL_ENABLED', 'false'
            if (havePlaySigning) signingConfig signingConfigs.playUpload
        }
    }
}

dependencies { implementation 'androidx.core:core:1.13.1' }

// Never accidentally publish a release APK signed with the debug key or without the pinned signer.
tasks.register('validatePublisherSigning') {
    doLast {
        if (!haveSigning || signerHash != pinnedSigner) {
            throw new GradleException('Refusing APK release: publisher signing key differs from the pinned NUTBUSTER identity')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'assembleRelease') task.dependsOn('validatePublisherSigning')
}

tasks.register('validatePlayUploadSigning') {
    doLast {
        if (!havePlaySigning) {
            throw new GradleException('Play bundle blocked: supply NEW nutbuster-play-upload-v1 upload key properties')
        }
        if (new File(playStore).canonicalPath == new File(signingPath ?: '/nonexistent').canonicalPath) {
            throw new GradleException('Play bundle blocked: old GitHub publisher keystore cannot be used')
        }
    }
}
tasks.configureEach { task ->
    if (task.name in ['bundlePlay', 'assemblePlay']) task.dependsOn('validatePlayUploadSigning')
}
