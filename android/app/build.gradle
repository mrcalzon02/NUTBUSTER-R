plugins { id 'com.android.application' }

// Sole permanent NUTBUSTER signing lineage: NEVER use ReverieVR or generate a replacement key.
def buildEpoch = (project.findProperty('nutbusterBuildEpochSeconds') ?: '0').toString().toLong()
def buildCode = buildEpoch > 1577836800L ? (buildEpoch - 1577836800L).intValue() : 1
def pinnedSigner = rootProject.file('../config/nutbuster-publisher.sha256').text.trim()
def signerHash = (project.findProperty('nutbusterSignerSha256') ?: '').toString().toLowerCase()
if (!(pinnedSigner ==~ /[0-9a-f]{64}/)) throw new GradleException('Invalid pinned NUTBUSTER certificate SHA-256')
def signingPath = (project.findProperty('phoneTestKeystorePath') ?: '').toString()
def storePass = (project.findProperty('phoneTestStorePassword') ?: '').toString()
def publisherAlias = (project.findProperty('phoneTestKeyAlias') ?: '').toString()
def publisherKeyPassword = (project.findProperty('phoneTestKeyPassword') ?: '').toString()
def haveSigning = signingPath && storePass && publisherAlias && publisherKeyPassword && file(signingPath).isFile()

android {
    namespace 'io.github.mrcalzon02.nutbuster'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.mrcalzon02.nutbuster'
        minSdk 26
        targetSdk 36
        versionCode buildCode
        versionName buildCode > 1 ? '0.1.0-test.' + buildCode : '0.1.0-alpha'
        buildConfigField 'String', 'DISTRIBUTION_SIGNER_SHA256', '"' + signerHash + '"'
        buildConfigField 'boolean', 'UPDATE_CHANNEL_ENABLED', 'false'
        // Play branch: unset integration IDs fail closed, never free-grant a paid product.
        buildConfigField 'boolean', 'PLAY_DISTRIBUTION', 'true'
        def verifier = (project.findProperty('nutbusterPlayVerifierUrl') ?: '').toString()
        def gamesId = (project.findProperty('nutbusterPlayGamesProjectId') ?: '').toString()
        if (verifier && !verifier.startsWith('https://')) throw new GradleException('Play verifier must use HTTPS')
        if (gamesId && !(gamesId ==~ /[0-9]+/)) throw new GradleException('Invalid Play Games project ID')
        buildConfigField 'String', 'PLAY_VERIFICATION_ENDPOINT', '"' + verifier + '"'
        buildConfigField 'String', 'PLAY_GAMES_PROJECT_ID', '"' + gamesId + '"'
        def integrityProject = (project.findProperty('nutbusterPlayIntegrityProjectNumber') ?: '').toString()
        if (integrityProject && !(integrityProject ==~ /[0-9]+/)) throw new GradleException('Invalid Play Integrity cloud project number')
        buildConfigField 'String', 'PLAY_INTEGRITY_PROJECT_NUMBER', '"' + integrityProject + '"'
        resValue 'string', 'game_services_project_id', gamesId ?: '0'
        resValue 'string', 'play_achievement_level_1', (project.findProperty('playAchievementLevel1') ?: '').toString()
        resValue 'string', 'play_achievement_level_100', (project.findProperty('playAchievementLevel100') ?: '').toString()
        resValue 'string', 'play_achievement_level_500', (project.findProperty('playAchievementLevel500') ?: '').toString()
        resValue 'string', 'play_achievement_level_1000', (project.findProperty('playAchievementLevel1000') ?: '').toString()
    }
    // android/app -> ../../web. The earlier ../../../web pointed outside the repository.
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (haveSigning) {
            phoneTest {
                storeFile file(signingPath)
                storePassword storePass
                keyAlias publisherAlias
                keyPassword publisherKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (haveSigning) signingConfig signingConfigs.phoneTest
        }
        debug { debuggable true }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.gms:play-services-games-v2:22.0.0'
    implementation 'com.google.android.play:integrity:1.6.0'
}

// Never accidentally publish a release APK signed with the debug key or without the pinned signer.
tasks.register('validatePublisherSigning') {
    doLast {
        if (!haveSigning || signerHash != pinnedSigner) {
            throw new GradleException('Refusing APK release: publisher signing key differs from the pinned NUTBUSTER identity')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'assembleRelease' || task.name == 'bundleRelease') task.dependsOn('validatePublisherSigning')
}

tasks.register('validatePlayReleaseConfiguration') {
    doLast {
        def endpoint = (project.findProperty('nutbusterPlayVerifierUrl') ?: '').toString()
        def id = (project.findProperty('nutbusterPlayGamesProjectId') ?: '').toString()
        if (!endpoint.startsWith('https://')) throw new GradleException('Missing HTTPS receipt verifier for Play release')
        if (!(id ==~ /[0-9]+/) || id == '0') throw new GradleException('Missing Play Games project ID')
        def integrityId = (project.findProperty('nutbusterPlayIntegrityProjectNumber') ?: '').toString()
        if (!(integrityId ==~ /[0-9]+/) || integrityId == '0') throw new GradleException('Missing Play Integrity cloud project number')
    }
}
tasks.configureEach { task ->
    if (task.name == 'bundleRelease' || task.name == 'assembleRelease') task.dependsOn('validatePlayReleaseConfiguration')
}
