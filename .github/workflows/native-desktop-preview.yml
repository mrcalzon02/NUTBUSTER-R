name: NUTBUSTER native desktop previews (SDL3, no browser)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - native/**
      - web/**
      - config/platform-parity.json
      - tools/platform-parity.js
      - tests/platform-parity.test.js
      - .github/workflows/build-and-release.yml
      - web/art/primary/nuts/**
      - web/art/nutvale/mining-ore/**
      - .github/workflows/native-desktop-preview.yml
  pull_request:
    branches: [main]
    paths:
      - native/**
      - web/**
      - config/platform-parity.json
      - tools/platform-parity.js
      - tests/platform-parity.test.js
      - .github/workflows/build-and-release.yml
      - web/art/primary/nuts/**
      - web/art/nutvale/mining-ore/**
      - .github/workflows/native-desktop-preview.yml

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux-x64
            binary: NUTBUSTER-Linux-x64
          - os: windows-2022
            label: Windows-x64
            binary: NUTBUSTER-Windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native Linux build requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libasound2-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all release lines and account for changed gameplay modules
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node tools/platform-parity.js validate
          if [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            # Compare the entire push range, not only the last commit.
            git diff --name-only "$BEFORE_SHA" HEAD > platform-changed-files.txt
          elif git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            # PR merge commit: first parent is the current base branch.
            git diff --name-only HEAD^1 HEAD > platform-changed-files.txt
          else
            echo '::error::Could not establish a base commit for parity impact audit'
            exit 1
          fi
          node tools/platform-parity.js impact platform-changed-files.txt
          node tools/platform-parity.js report > platform-parity-report.txt
      - name: Export authored NUTBUSTER layouts and objectives from source JS (build-time only)
        run: |
          node native/generate_campaign_levels.js
          test -s native/generated-assets/data/campaign.tsv
          test "$(grep -c '^L ' native/generated-assets/data/campaign.tsv)" -eq 1000
      - name: Convert approved sprites to native BMP runtime format
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python native/prepare_assets.py
          test -s native/generated-assets/data/nuts/peanut.bmp
          test -s native/generated-assets/data/maps/campaign-overview.bmp
          test -s native/generated-assets/data/mine/r1c1.bmp
          test -s native/generated-assets/data/mine/r4c6.bmp
          test -s native/generated-assets/data/gear/pickaxe-00.bmp
          test -s native/generated-assets/data/gear/pickaxe-39.bmp
          test -s native/generated-assets/data/gear/gloves-00.bmp
          test -s native/generated-assets/data/gear/gloves-39.bmp
      - name: Configure C++17 SDL3 native game
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Compile and stage platform-native application
        run: |
          cmake --build native/build --config Release --parallel 4
          cmake --install native/build --config Release --prefix native/package
          test -s "native/package/${{ matrix.binary }}"
          test -s native/package/data/nuts/peanut.bmp
          test -s native/package/data/maps/campaign-overview.bmp
          test -s native/package/data/mine/r3c4.bmp
          test -s native/package/data/gear/pickaxe-39.bmp
          test -s native/package/data/gear/gloves-39.bmp
          test -s native/package/data/campaign.tsv
          test -s native/package/data/blocker/ice-1.rgba
          test -s native/package/data/overlay/sticky-butter.rgba
      - name: Test native game logic without any GUI or browser
        run: "native/package/${{ matrix.binary }} --self-test"
      - name: Compare native mining geology against existing JavaScript game
        run: |
          node native/generate_mine_fixtures.js > native-mine-fixtures.txt
          native/package/${{ matrix.binary }} --verify-mine-fixtures native-mine-fixtures.txt
      - name: Render actual SDL3 game screens on Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a native/package/NUTBUSTER-Linux-x64 --preview-board --smoke-render native-board.bmp
          xvfb-run -a native/package/NUTBUSTER-Linux-x64 --preview-campaign --smoke-render native-campaign.bmp
          xvfb-run -a native/package/NUTBUSTER-Linux-x64 --preview-stage 3 --smoke-render native-stage-3.bmp
          xvfb-run -a native/package/NUTBUSTER-Linux-x64 --preview-stage 1000 --smoke-render native-stage-1000.bmp
          xvfb-run -a native/package/NUTBUSTER-Linux-x64 --preview-mine --smoke-render native-mine.bmp
          xvfb-run -a native/package/NUTBUSTER-Linux-x64 --smoke-mine-dig --smoke-render native-mine-dug.bmp
          xvfb-run -a native/package/NUTBUSTER-Linux-x64 --preview-equipment --smoke-render native-mine-equipment.bmp
          xvfb-run -a native/package/NUTBUSTER-Linux-x64 --preview-refinery --smoke-render native-mine-refinery.bmp
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for screen in ('native-board','native-campaign','native-stage-3','native-stage-1000','native-mine','native-mine-dug','native-mine-equipment','native-mine-refinery'):
              path=Path(screen+'.bmp')
              with Image.open(path) as im:
                  assert im.size==(1024,768), (screen,im.size)
                  im.convert('RGB').save(screen+'.png')
              assert Path(screen+'.png').stat().st_size>1024
              print('Native SDL3 screenshot:',screen+'.png')
          import hashlib
          src=[Path(x) for x in ('native-board.png','native-stage-3.png','native-stage-1000.png')]
          digests=[hashlib.sha256(x.read_bytes()).hexdigest() for x in src]
          assert len(set(digests))==3, 'Authoritative stages rendered identical: board selection failed'
          print('Native stage 1, 3 and 1000 render differently as intended')
          PY
      - name: Reject browser-based distribution artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('native/package')
          forbidden={'electron','chrome','chromium','webview','node.exe','index.html'}
          hits=[str(p) for p in base.rglob('*') if p.name.lower() in forbidden]
          if hits: raise SystemExit('Native output contains browser components: '+str(hits))
          assert len(list((base/'data'/'nuts').glob('*.bmp'))) == 19
          assert len(list((base/'data'/'mine').glob('*.bmp'))) == 24
          assert len(list((base/'data'/'gear').glob('pickaxe-*.bmp'))) == 40
          assert len(list((base/'data'/'gear').glob('gloves-*.bmp'))) == 40
          assert len(list((base/'data'/'blocker').glob('*.rgba'))) == 8
          assert len(list((base/'data'/'overlay').glob('*.rgba'))) == 2
          assert sum(1 for line in (base/'data'/'campaign.tsv').open() if line.startswith('L ')) == 1000
          print('No Chromium, Electron, WebView, HTML or local server distribution.')
          PY
      - name: Produce native-only preview ZIP
        run: |
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          dest=Path('NUTBUSTER-Native-${{ matrix.label }}-PREVIEW.zip')
          root=Path('native/package')
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in root.rglob('*'):
                  if p.is_file():
                      info=zipfile.ZipInfo.from_file(p,str(p.relative_to(root)))
                      if os.name!='nt' and p.name=='NUTBUSTER-Linux-x64':
                          info.external_attr=(0o100755 << 16)
                      z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED)
          assert dest.stat().st_size>10000
          print(dest,dest.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Nutbuster-Native-${{ matrix.label }}-PREVIEW-${{ github.run_id }}
          path: |
            NUTBUSTER-Native-${{ matrix.label }}-PREVIEW.zip
            platform-parity-report.txt
            native-board.png
            native-campaign.png
            native-stage-3.png
            native-stage-1000.png
            native-mine.png
            native-mine-dug.png
            native-mine-equipment.png
            native-mine-refinery.png
          retention-days: 30
          if-no-files-found: error
