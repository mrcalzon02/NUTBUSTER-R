name: NUTBUSTER Android, desktop and signed update release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Independent build runs can execute in parallel; only the publishing job is serialized.
concurrency:
  group: nutbuster-build-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mandatory gameplay, economy, persistence, and packaging contracts
        shell: bash
        run: |
          set -euo pipefail
          node tools/test-tiers.js validate
          node tools/test-tiers.js functional > "$RUNNER_TEMP/nutbuster-functional-suites.txt"
          failures=()
          while IFS= read -r suite; do
            [[ -n "$suite" ]] || continue
            echo "::group::$suite"
            if ! node "$suite"; then failures+=("$suite"); fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/nutbuster-functional-suites.txt"
          if ! python3 tests/test_update_manifest.py; then failures+=("tests/test_update_manifest.py"); fi
          if (( ${#failures[@]} > 0 )); then
            printf '::error::RELEASE BLOCKED by %s functional failures: %s\\n' "${#failures[@]}" "${failures[*]}"
            exit 1
          fi
          echo "All release-blocking gameplay, economy, persistence, and package tests passed."

  # Diagnostically valuable, but never part of the signed publisher dependency chain.
  # A failing suite makes this job red and uploads evidence without holding the APK.
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run optional visual, audio, UI, and content checks
        shell: bash
        run: |
          set -euo pipefail
          node tools/test-tiers.js validate
          node tools/test-tiers.js diagnostic > "$RUNNER_TEMP/nutbuster-diagnostic-suites.txt"
          mkdir -p "$RUNNER_TEMP/nutbuster-diagnostics"
          failures=()
          while IFS= read -r suite; do
            [[ -n "$suite" ]] || continue
            echo "::group::$suite"
            if ! node "$suite" 2>&1 | tee "$RUNNER_TEMP/nutbuster-diagnostics/$(basename "$suite").log"; then
              failures+=("$suite")
              echo "::error file=$suite::Non-blocking diagnostic failure"
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/nutbuster-diagnostic-suites.txt"
          if (( ${#failures[@]} > 0 )); then
            printf '::error::%s diagnostic suites failed (APK release remains eligible): %s\\n' "${#failures[@]}" "${failures[*]}"
            exit 1
          fi
          echo "All optional diagnostic suites passed."
      - name: Audit freshness of release-news descriptions (non-blocking)
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,publishedAt --jq '[.[] | select(.isDraft == false)] | sort_by(.publishedAt) | last | .tagName // empty')"
          if [[ -n "$LAST_TAG" ]]; then
            git fetch --no-tags origin "refs/tags/$LAST_TAG:refs/tags/$LAST_TAG"
            NUTBUSTER_RELEASE_BASE="$LAST_TAG" node tools/release-news.js --check
          else
            node tools/release-news.js --check
          fi
      - name: Run exploratory difficulty and automated player-proxy audits
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failures=()
          if ! node tools/difficulty-audit.js > "$RUNNER_TEMP/nutbuster-difficulty-audit.json"; then failures+=("difficulty-audit"); fi
          if ! node tools/greedy-playtest.js > "$RUNNER_TEMP/nutbuster-greedy-playtest.json"; then failures+=("greedy-playtest"); fi
          if (( ${#failures[@]} > 0 )); then
            printf '::error::Non-blocking audit failures: %s\\n' "${failures[*]}"
            exit 1
          fi
      - name: Preserve all optional diagnostic evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nutbuster-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nutbuster-diagnostics/
            ${{ runner.temp }}/nutbuster-difficulty-audit.json
            ${{ runner.temp }}/nutbuster-greedy-playtest.json
          retention-days: 30
          if-no-files-found: ignore

  desktop:
    needs: functional-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Embed exact release notes in desktop launchers
        run: node tools/release-news.js --generate "nutbuster-phone-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" "$GITHUB_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Compile self-contained desktop launchers
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build_desktop_launchers.sh
          test -s release/NUTBUSTER-Windows-x64.exe
          test -s release/NUTBUSTER-Linux-x64
          mkdir -p release/metadata
          sha256sum release/NUTBUSTER-* > release/metadata/SHA256SUMS.txt
          printf 'Git SHA: %s\n' "$GITHUB_SHA" > release/metadata/BUILD.txt
          file release/NUTBUSTER-Windows-x64.exe release/NUTBUSTER-Linux-x64
      - name: Verify Linux launch actually serves the game
        shell: bash
        run: |
          set -euo pipefail
          release/NUTBUSTER-Linux-x64 --no-browser > "$RUNNER_TEMP/nutbuster-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:43823/__nutbuster_ping 2>/dev/null | grep -qx NUTBUSTER_OFFLINE_V1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:43823/__nutbuster_ping | grep -qx NUTBUSTER_OFFLINE_V1
          curl -fsSL http://127.0.0.1:43823/ -o "$RUNNER_TEMP/nutbuster-index.html"
          grep -Fq 'NUTBUSTER' "$RUNNER_TEMP/nutbuster-index.html"
          curl -fsS http://127.0.0.1:43823/audio/grunt-1.mp3 -o "$RUNNER_TEMP/grunt.mp3"
          test -s "$RUNNER_TEMP/grunt.mp3"
          curl -fsSL http://127.0.0.1:43823/art/maps/chapter-5-moonlit-golden-palace.webp -o "$RUNNER_TEMP/chapter-5.webp"
          test -s "$RUNNER_TEMP/chapter-5.webp"
      - uses: actions/upload-artifact@v4
        with:
          name: Nutbuster-Desktop-${{ github.run_id }}
          path: |
            release/NUTBUSTER-Windows-x64.exe
            release/NUTBUSTER-Linux-x64
            release/metadata/
          retention-days: 30
          if-no-files-found: error

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Embed exact release notes in Android debug preview
        run: node tools/release-news.js --generate "nutbuster-phone-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --stacktrace :app:assembleDebug
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools/36.0.0"
          "$SDK/apksigner" verify --verbose --print-certs "$APK"
          "$SDK/aapt" dump badging "$APK" | tee android/debug-badging.txt
          grep -F "package: name='io.github.mrcalzon02.nutbuster'" android/debug-badging.txt
          unzip -Z -1 "$APK" | grep -Fx assets/index.html
          unzip -Z -1 "$APK" | grep -Fx assets/game.js
          unzip -Z -1 "$APK" | grep -Fx assets/audio/grunt-1.mp3
          unzip -Z -1 "$APK" | grep -Fx assets/art/primary/nuts/peanut.png
          unzip -Z -1 "$APK" | grep -Fx assets/art/maps/campaign-overview.webp
          unzip -Z -1 "$APK" | grep -Fx assets/art/maps/chapter-5-moonlit-golden-palace.webp
          mkdir -p release
          cp "$APK" release/NUTBUSTER-Android-debug.apk
          sha256sum release/NUTBUSTER-Android-debug.apk > release/NUTBUSTER-Android-debug.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Nutbuster-Android-debug-${{ github.run_id }}
          path: |
            release/NUTBUSTER-Android-debug.apk
            release/NUTBUSTER-Android-debug.sha256
            android/debug-badging.txt
          retention-days: 30
          if-no-files-found: error
      - name: Preserve Android build diagnostics if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nutbuster-Android-diagnostics-${{ github.run_id }}
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore

  emulator-smoke:
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nutbuster-Android-debug-${{ github.run_id }}
          path: validation
      - name: Diagnose Android emulator hardware acceleration
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::KVM not available on runner; cold emulator boot may be slow."
          fi
      - name: Install and launch on Android 26 emulator (bounded evidence checks)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash scripts/android-emulator-smoke.sh
      - name: Upload Android 26 smoke diagnostics, even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nutbuster-Emulator-Evidence-${{ github.run_id }}
          path: |
            validation/nutbuster-android26.png
            validation/android26-launch.txt
            validation/android26-activity.txt
            validation/android26-pid.txt
            validation/android26-crashlog.txt
            validation/android26-smoke-steps.txt
          retention-days: 14
          if-no-files-found: ignore

  publisher-release:
    # Protect the sole signed publisher channel without delaying other builds.
    concurrency:
      group: nutbuster-publisher-release
      cancel-in-progress: false
    if: github.event_name != 'pull_request'
    # Only functional test failures and required desktop artifacts gate publication.
    # Android debug, emulator, visuals, audits and text freshness remain red/visible
    # on failure but do not stop the independently signed release APK.
    needs: [functional-tests, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PHONE_TEST_KEYSTORE_BASE64: ${{ secrets.PHONE_TEST_KEYSTORE_BASE64 }}
      PHONE_TEST_STORE_PASSWORD: ${{ secrets.PHONE_TEST_STORE_PASSWORD }}
      PHONE_TEST_KEY_ALIAS: ${{ secrets.PHONE_TEST_KEY_ALIAS }}
      PHONE_TEST_KEY_PASSWORD: ${{ secrets.PHONE_TEST_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Embed exact release news in the signed APK
        run: node tools/release-news.js --generate "nutbuster-phone-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - uses: actions/download-artifact@v4
        with:
          name: Nutbuster-Desktop-${{ github.run_id }}
          path: release/desktop
      - name: Validate Nutbuster-owned publisher signing secrets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PHONE_TEST_KEYSTORE_BASE64" || -z "$PHONE_TEST_STORE_PASSWORD" || -z "$PHONE_TEST_KEY_ALIAS" || -z "$PHONE_TEST_KEY_PASSWORD" ]]; then
            echo '::error::NUTBUSTER signing secrets missing. Run scripts/setup-nutbuster-signing.sh with an authorized gh login.'
            exit 1
          fi
          printf '%s' "$PHONE_TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nutbuster-publisher.p12"
          chmod 600 "$RUNNER_TEMP/nutbuster-publisher.p12"
          keytool -list -keystore "$RUNNER_TEMP/nutbuster-publisher.p12" -storepass "$PHONE_TEST_STORE_PASSWORD" -alias "$PHONE_TEST_KEY_ALIAS" >/dev/null
          keytool -exportcert -keystore "$RUNNER_TEMP/nutbuster-publisher.p12" -storepass "$PHONE_TEST_STORE_PASSWORD" -alias "$PHONE_TEST_KEY_ALIAS" -file "$RUNNER_TEMP/nutbuster-certificate.der" >/dev/null
          SHA="$(sha256sum "$RUNNER_TEMP/nutbuster-certificate.der" | cut -d' ' -f1)"
          PINNED="$(tr -d '[:space:]' < config/nutbuster-publisher.sha256)"
          [[ "$PINNED" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Missing/invalid pinned NUTBUSTER signer'; exit 1; }
          [[ "$SHA" = "$PINNED" ]] || { echo '::error::Wrong signing certificate: only the NUTBUSTER-owned publisher key is permitted'; exit 1; }
          printf 'sha=%s\npath=%s\n' "$SHA" "$RUNNER_TEMP/nutbuster-publisher.p12" >> "$GITHUB_OUTPUT"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build permanently signed release APK
        id: signed
        shell: bash
        env:
          ORG_GRADLE_PROJECT_phoneTestKeystorePath: ${{ steps.signing.outputs.path }}
          ORG_GRADLE_PROJECT_phoneTestStorePassword: ${{ secrets.PHONE_TEST_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_phoneTestKeyAlias: ${{ secrets.PHONE_TEST_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_phoneTestKeyPassword: ${{ secrets.PHONE_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          CODE=$(( BUILD_EPOCH - 1577836800 ))
          (( CODE > 1 && CODE <= 2100000000 ))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          gradle -p android --no-daemon --stacktrace -PnutbusterBuildEpochSeconds="$BUILD_EPOCH" -PnutbusterSignerSha256="${{ steps.signing.outputs.sha }}" :app:assembleRelease
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools/36.0.0"
          "$SDK/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/certificate.txt"
          SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certificate.txt" | head -n 1 | tr '[:upper:]' '[:lower:]')"
          PINNED="$(tr -d '[:space:]' < config/nutbuster-publisher.sha256)"
          test "$SIGNER" = "$PINNED"
          test "$SIGNER" = "${{ steps.signing.outputs.sha }}"
          "$SDK/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='io.github.mrcalzon02.nutbuster' versionCode='$CODE'" "$RUNNER_TEMP/badging.txt"
          unzip -Z -1 "$APK" | grep -Fx assets/audio/they-just-keep-coming.mp3
          unzip -Z -1 "$APK" | grep -Fx assets/art/maps/chapter-1-nutwood-meadows.webp
          mkdir -p release/publish
          cp "$APK" release/publish/NUTBUSTER-Android-phone-test.apk
          sha256sum release/publish/NUTBUSTER-Android-phone-test.apk > release/publish/SHA256SUMS.txt
          sha256sum -c release/publish/SHA256SUMS.txt
          printf 'Source revision: %s\nAndroid versionCode: %s\nCertificate SHA-256: %s\n' "$GITHUB_SHA" "$CODE" "$SIGNER" > release/publish/BUILD-EVIDENCE.txt
      - name: Publish signed APK and desktop downloads after remote verification
        shell: bash
        run: |
          set -euo pipefail
          TAG="nutbuster-phone-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refusing to overwrite existing artifacts"
            exit 1
          fi
          cp release/desktop/NUTBUSTER-Windows-x64.exe release/publish/
          cp release/desktop/NUTBUSTER-Linux-x64 release/publish/
          python3 scripts/generate_update_manifest.py "$TAG" '${{ steps.signed.outputs.code }}' '${{ steps.signing.outputs.sha }}'
          (cd release/publish && sha256sum NUTBUSTER-* > SHA256SUMS.txt)
          node tools/release-news.js --notes '${{ steps.signed.outputs.code }}' '${{ steps.signing.outputs.sha }}' > "$RUNNER_TEMP/nutbuster-release-notes.md"
          gh release create "$TAG" --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "NUTBUSTER Phone Test $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" --notes-file "$RUNNER_TEMP/nutbuster-release-notes.md"
          gh release upload "$TAG" release/publish/NUTBUSTER-Android-phone-test.apk release/publish/NUTBUSTER-Windows-x64.exe release/publish/NUTBUSTER-Linux-x64 release/publish/NUTBUSTER-update.json release/publish/NUTBUSTER-news.json release/publish/SHA256SUMS.txt release/publish/BUILD-EVIDENCE.txt --repo "$GITHUB_REPOSITORY"
          # GitHub computes SHA-256 for release assets. Refuse to publish until its digest matches our local artifact.
          # Draft tags may not exist yet. Resolve the draft ID through gh, which
          # can find unpublished releases, then read its assets by release ID.
          RELEASE_ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo '::error::Invalid draft release ID'; exit 1; }
          remote="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          REMOTE_JSON="$remote" python3 - <<'PY'
          import hashlib,json,os,pathlib
          release=json.loads(os.environ['REMOTE_JSON'])
          expected={p.name:(p.stat().st_size, 'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()) for p in pathlib.Path('release/publish').iterdir() if p.is_file()}
          assets={a['name']:a for a in release['assets']}
          for name,(size,digest) in expected.items():
              a=assets.get(name)
              if not a or a.get('size')!=size or a.get('digest')!=digest:
                  raise SystemExit(f'RELEASE BLOCKED: {name} remote SHA-256/size readback mismatch')
          print('Remote release asset size and GitHub SHA-256 verified for',len(expected),'files')
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url | tee release/publish/release-proof.json
          python3 -c 'import json; assert not json.load(open("release/publish/release-proof.json"))["isDraft"]'
      - uses: actions/upload-artifact@v4
        with:
          name: Nutbuster-signed-release-evidence-${{ github.run_id }}
          path: |
            release/publish/BUILD-EVIDENCE.txt
            release/publish/SHA256SUMS.txt
            release/publish/release-proof.json
          retention-days: 30
          if-no-files-found: error
